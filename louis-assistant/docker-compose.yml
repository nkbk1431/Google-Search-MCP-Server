version: "3.9"

services:
  # ── 루이스 FastAPI 백엔드 ────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: louis-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite+aiosqlite:///./louis.db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - louis_db:/app/data
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Redis 캐시 (응답 캐싱, 세션) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: louis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

volumes:
  louis_db:
  redis_data:
