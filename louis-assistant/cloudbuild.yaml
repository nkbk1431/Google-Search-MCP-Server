# Google Cloud Build - Cloud Run 자동 배포
# 사용법: gcloud builds submit --config cloudbuild.yaml
# 필요 환경변수는 Secret Manager에서 관리

steps:
  # 1. Docker 이미지 빌드
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "-t"
      - "gcr.io/$PROJECT_ID/louis-api:$SHORT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/louis-api:latest"
      - "./backend"

  # 2. 이미지 푸시
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "gcr.io/$PROJECT_ID/louis-api:$SHORT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "gcr.io/$PROJECT_ID/louis-api:latest"

  # 3. Cloud Run 배포
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - louis-api
      - "--image=gcr.io/$PROJECT_ID/louis-api:$SHORT_SHA"
      - "--region=asia-northeast3"           # 서울
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--concurrency=80"
      - "--timeout=60s"
      - "--set-env-vars=APP_ENV=production"
      - "--set-secrets=ANTHROPIC_API_KEY=anthropic-api-key:latest,OPENWEATHER_API_KEY=openweather-key:latest"

images:
  - "gcr.io/$PROJECT_ID/louis-api:$SHORT_SHA"
  - "gcr.io/$PROJECT_ID/louis-api:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
